spring.application.name=apigateway

# API Gateway Configuration
server.port=8080

# Eureka Server Configuration (Register Gateway with Eureka)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Enable Actuator for Monitoring
management.endpoints.web.exposure.include=routes


# API Gateway Routes Configuration

# Route for User Service
spring.cloud.gateway.mvc.routes[0].id=userservice
spring.cloud.gateway.mvc.routes[0].uri=lb://userservice
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/users/**

# Route for Flight Service
spring.cloud.gateway.mvc.routes[1].id=flightservice
spring.cloud.gateway.mvc.routes[1].uri=lb://flightservice
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/flights/**

# Route for Booking Service
spring.cloud.gateway.mvc.routes[2].id=booking-service
spring.cloud.gateway.mvc.routes[2].uri=lb://booking-service
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/bookings/**


# Route for Payment Service
spring.cloud.gateway.mvc.routes[3].id=paymentservice
spring.cloud.gateway.mvc.routes[3].uri=lb://PAYMENTSERVICE
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/payments/**

# Route for Payment Service
spring.cloud.gateway.mvc.routes[4].id=checkinservice
spring.cloud.gateway.mvc.routes[4].uri=lb://checkinservice
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/checkin/**


# Enable Gateway Logging for Debugging
logging.level.org.springframework.cloud.gateway=DEBUG




#? All microservices are routed through a single entry point.
#? The gateway automatically discovers and routes services via Eureka.